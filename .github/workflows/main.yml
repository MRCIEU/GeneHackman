name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mrcieu/genehackman:develop
      # R packages from docker/requirements.R live in /usr/lib/R/site-library; without this,
      # R only sees /opt/R/.../library and library(devtools) / devtools::check() fail.
      env:
        R_LIBS_SITE: /usr/lib/R/site-library

    steps:
      - uses: actions/checkout@v4

      - name: Run devtools::check()
        run: Rscript -e "devtools::check()"
