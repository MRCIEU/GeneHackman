# Revision 1 re-analysis of the heart failure demonstration (compare_gwases: heterogeneity, expected vs observed, LDSC h2 and rg for every pair).
# Run from the repository root with ./run_pipeline.sh; hf_data/ is a symlink to the folder holding the GWAS files
# (see REVISION1_PLAN2.md).
ld_reference: 1000genomes  # required since 1.2.0; the panel used in the re-analysis
gwases:
  - file: hf_data/FORMAT-METAL_Pheno1_EUR.tsv.gz
    columns: &hermes_columns
      SNP: rsID
      CHR: chr
      BP: pos_b37
      EA: A1
      OA: A2
      EAF: A1_freq
      BETA: A1_beta
      SE: se
      P: pval
      N_CASES: N_case  # per-variant cases and total, so N_EFF is per variant (controls = N_total - N_case)
      N: N_total
    build: GRCh37
    ancestry: EUR
    label: HFall
    study_type: binary
    N_case: 139533  # Henry et al. 2025, Supplementary Table 2, European; used only where a variant has no per-variant counts
    N_control: 1568809
    prevalence: 0.08168  # as Henry et al. 2025: the meta-analysis case fraction, 139,533 / 1,708,342 (EUR)
  - file: hf_data/FORMAT-METAL_Pheno3_EUR.tsv.gz
    columns: *hermes_columns
    build: GRCh37
    ancestry: EUR
    label: ni-HFrEF
    study_type: binary
    N_case: 4975  # Henry et al. 2025, Supplementary Table 2, European
    N_control: 935830
    prevalence: 0.005288  # as Henry et al. 2025: the meta-analysis case fraction, 4,975 / 940,805 (EUR)
  - file: hf_data/FORMAT-METAL_Pheno4_EUR.tsv.gz
    columns: *hermes_columns
    build: GRCh37
    ancestry: EUR
    label: ni-HFpEF
    study_type: binary
    N_case: 3590  # Henry et al. 2025, Supplementary Table 2, European (3,841 is all ancestries)
    N_control: 752599
    prevalence: 0.004747  # as Henry et al. 2025: the meta-analysis case fraction, 3,590 / 756,189 (EUR)
plink_clump_arguments: "--clump-p1 5e-8 --clump-r2 0.01 --clump-kb 1000"
ldsc:
  ld_scores: pan_ukb
