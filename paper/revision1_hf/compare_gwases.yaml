# Revision 1 re-analysis of the heart failure demonstration (compare_gwases: heterogeneity, expected vs observed, LDSC h2 and rg for every pair).
# Run from the repository root with ./run_pipeline.sh; hf_data/ is a symlink to the folder holding the GWAS files
# (see REVISION1_PLAN2.md). Case and control counts marked TODO must be filled in before running: 0 stops the
# pipeline with a message.
gwases:
  - file: hf_data/FORMAT-METAL_Pheno1_EUR.tsv.gz
    columns: &hermes_columns
      SNP: rsID
      CHR: chr
      BP: pos_b37
      EA: A1
      OA: A2
      EAF: A1_freq
      BETA: A1_beta
      SE: se
      P: pval
      # add per-variant counts if the file has them (check the header first), e.g. N_CASES: <col>, N_CONTROLS: <col>
    build: GRCh37
    ancestry: EUR
    label: HFall
    study_type: binary
    N_case: 0  # TODO: HFall cases, Henry et al. 2025 Table 1
    N_control: 0  # TODO: HFall controls
    prevalence: 0.02  # population prevalence of HF: decide (0.01-0.02 in most LDSC analyses of HF)
  - file: hf_data/FORMAT-METAL_Pheno3_EUR.tsv.gz
    columns: *hermes_columns
    build: GRCh37
    ancestry: EUR
    label: ni-HFrEF
    study_type: binary
    N_case: 0  # TODO: ni-HFrEF cases
    N_control: 0  # TODO: ni-HFrEF controls
    prevalence: 0.01  # decide
  - file: hf_data/FORMAT-METAL_Pheno4_EUR.tsv.gz
    columns: *hermes_columns
    build: GRCh37
    ancestry: EUR
    label: ni-HFpEF
    study_type: binary
    N_case: 3841  # check against Henry et al. 2025
    N_control: 0  # TODO: ni-HFpEF controls
    prevalence: 0.01  # decide
plink_clump_arguments: "--clump-p1 5e-8 --clump-r2 0.01 --clump-kb 1000"
ldsc:
  ld_scores: pan_ukb
