# Revision 1 re-analysis of the heart failure demonstration (finemap, HFall, 1000genomes LD, L = 1).
# GeneHackman 1.2.0. Run from the repository root with ./run_pipeline.sh snakemake/<pipeline>.smk <this file>;
# hf_data/ is the folder holding the input GWAS files (manuscript Table 2).
ld_reference: 1000genomes
gwases:
  - file: hf_data/FORMAT-METAL_Pheno1_EUR.tsv.gz
    columns: &hermes_columns
      SNP: rsID
      CHR: chr
      BP: pos_b37
      EA: A1
      OA: A2
      EAF: A1_freq
      BETA: A1_beta
      SE: se
      P: pval
      N_CASES: N_case  # per-variant cases and total, so N_EFF is per variant (controls = N_total - N_case)
      N: N_total
    build: GRCh37
    ancestry: EUR
    label: HFall
    study_type: binary
    N_case: 139533  # Henry et al. 2025, Supplementary Table 2, European; used only where a variant has no per-variant counts
    N_control: 1568809
    prevalence: 0.08168  # as Henry et al. 2025: the meta-analysis case fraction, 139,533 / 1,708,342 (EUR)
plink_clump_arguments: "--clump-p1 5e-8 --clump-r2 0.01 --clump-kb 1000"
finemap:
  window_kb: 1000
  max_causal: 1
  coverage: 0.95
  min_abs_corr: 0.5
  region_strategy: merge
  max_region_kb: 3000
