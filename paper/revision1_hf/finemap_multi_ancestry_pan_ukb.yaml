# Revision 1 re-analysis of the heart failure demonstration (multi-ancestry finemap (MultiSuSiE), HFall EUR + BBJ EAS, pan_ukb LD).
# Run from the repository root with ./run_pipeline.sh; hf_data/ is a symlink to the folder holding the GWAS files
# (see REVISION1_PLAN2.md).
ld_reference: pan_ukb
gwases:
  - file: hf_data/FORMAT-METAL_Pheno1_EUR.tsv.gz
    columns: &hermes_columns
      SNP: rsID
      CHR: chr
      BP: pos_b37
      EA: A1
      OA: A2
      EAF: A1_freq
      BETA: A1_beta
      SE: se
      P: pval
      N_CASES: N_case  # per-variant cases and total, so N_EFF is per variant (controls = N_total - N_case)
      N: N_total
    build: GRCh37
    ancestry: EUR
    label: HFall
    study_type: binary
    N_case: 139533  # Henry et al. 2025, Supplementary Table 2, European; used only where a variant has no per-variant counts
    N_control: 1568809
    prevalence: 0.08168  # as Henry et al. 2025: the meta-analysis case fraction, 139,533 / 1,708,342 (EUR)
  - file: hf_data/hf_japan_GCST90668009.tsv.gz
    build: GRCh37  # checked 7 Nov 2026: 88% of its chr22 SNVs match the GRCh37 1000G EAS panel, 0.1% GRCh38
    ancestry: EAS
    label: BBJ-HF
    study_type: binary
    N_case: 16251    # Enzan et al. 2025, all-cause HF
    N_control: 197577
plink_clump_arguments: "--clump-p1 5e-8 --clump-r2 0.01 --clump-kb 1000"
finemap:
  window_kb: 1000
  max_causal: auto
  coverage: 0.95
  min_abs_corr: 0.5
  region_strategy: merge
  max_region_kb: 3000
