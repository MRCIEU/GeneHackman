gwases:
  - file: ""
    columns:
      CHR: ""
      BP: ""
      EA: ""
      OA: ""
      EAF: ""
      P: ""
      BETA: ""
      SE: ""
    ancestry: EUR
    N: 0
ld_reference: 1000genomes   # or pan_ukb: precomputed Pan-UKB LD (see PIPELINES.md)
plink_clump_arguments: "--clump-p1 5e-8 --clump-r2 0.01 --clump-kb 1000"
finemap:
  window_kb: 1000
  max_causal: auto   # L = 1 when GWAS N > 10 x LD reference N (e.g. 1000 Genomes); a number to override
  coverage: 0.95
  min_abs_corr: 0.5
qtl:
  dataset: ""            # eqtlgen, brainmeta or ukb_pqtl (cis QTLs)
  exposures: []
  study_type: continuous
populate_rsid: false
