gwases:
  - file: /path/to/gwas.tsv.gz
    columns:
      CHR: CHR
      BP: BP
      EA: EA
      OA: OA
      EAF: EAF
      P: P
      BETA: BETA
      SE: SE
    build: GRCh38
    ancestry: EUR
    populate_eaf: false
ld_reference: pan_ukb   # required when a GWAS has an ancestry (strand check) or populate_eaf: pan_ukb or 1000genomes
output:
  build: GRCh38
populate_rsid: false
